name: Restore original Andee - permission guide only
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  original:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - name: Checkout isolated publishing instructions
        uses: actions/checkout@v4
        with:
          ref: andee-original-permission-only-20261105
          persist-credentials: true
      - name: Fetch original Andee v0.11.0
        uses: actions/checkout@v4
        with:
          repository: kuafuai/andee
          ref: v0.11.0
          path: andee-src
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android platform 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Add only Android Accessibility setup guide
        run: python3 andee_restore/patch_permission_guide.py andee-src
      - name: Verify ORIGINAL screen features and core build settings untouched
        run: |
          set -euo pipefail
          git -C andee-src diff --exit-code -- app/src/main/java/net/kuafuai/andee/screen/ScreenController.kt
          git -C andee-src diff --exit-code -- app/src/main/java/net/kuafuai/andee/ScreenBodyService.kt
          git -C andee-src diff --exit-code -- app/build.gradle
          grep -q 'ACTION_APPLICATION_DETAILS_SETTINGS' andee-src/app/src/main/java/net/kuafuai/andee/ui/AccessibilityPermissionGuideActivity.kt
          grep -q 'ACTION_ACCESSIBILITY_SETTINGS' andee-src/app/src/main/java/net/kuafuai/andee/ui/AccessibilityPermissionGuideActivity.kt
          grep -q 'AccessibilityPermissionGuideActivity::class.java' andee-src/app/src/main/java/net/kuafuai/andee/device/SelfCheck.kt
          if grep -q 'ManualScreenControls' andee-src/app/src/main/java/net/kuafuai/andee/ScreenBodyService.kt; then exit 1; fi
      - name: Compile original Andee Android ARM64 debug APK
        working-directory: andee-src
        run: |
          gradle :app:assembleDebug --no-daemon -PdefaultLang=hi -PcodeflyingDomain=myapp.codeflying.app -PcodeflyingSsl=true
      - name: Verify signed original functionality and permission help
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find andee-src/app/build/outputs/apk/debug -type f -iname '*arm64*apk' | head -n 1)"
          if [ -z "$APK" ]; then APK="$(find andee-src/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"; fi
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > manifest.txt
          grep -q "ScreenBodyService" manifest.txt
          grep -q "BIND_ACCESSIBILITY_SERVICE" manifest.txt
          grep -q "AccessibilityPermissionGuideActivity" manifest.txt
          mkdir -p downloads
          cp "$APK" downloads/Andee_Original_Permission_Guide_Arm64.apk
          sha256sum downloads/Andee_Original_Permission_Guide_Arm64.apk > downloads/Andee_Original_Permission_Guide_Arm64.sha256
          du -h downloads/Andee_Original_Permission_Guide_Arm64.apk
      - name: Publish original restored APK (public branch only)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/Andee_Original_Permission_Guide_Arm64.apk downloads/Andee_Original_Permission_Guide_Arm64.sha256
          if ! git diff --cached --quiet; then
            git commit -m "Publish original Andee with permission guide only [skip ci]"
            git push origin HEAD:refs/heads/andee-original-permission-only-20261105
          fi
      - name: Temporary test artifact
        uses: actions/upload-artifact@v4
        with:
          name: Andee-Original-Permission-Guide-Arm64
          path: |
            downloads/Andee_Original_Permission_Guide_Arm64.apk
            downloads/Andee_Original_Permission_Guide_Arm64.sha256
          if-no-files-found: error
          retention-days: 14
