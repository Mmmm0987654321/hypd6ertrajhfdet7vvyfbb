name: Publish existing Andee API36 debug test APK to public branch
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  publish-existing-tested-apk:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    timeout-minutes: 12
    steps:
      - name: Checkout isolated public branch only
        uses: actions/checkout@v4
        with:
          ref: andee-play-review-prep-20261105
          persist-credentials: true
      - name: Download existing verified Android artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifact
          gh run download 42035198112 -n Andee-Manual-Screen-API36-Debug-Review -D artifact
          find artifact -maxdepth 2 -type f -printf '%P %s bytes\n'
          test -s artifact/Andee_Manual_Accessibility_API36_Arm64_Debug.apk
      - name: Publish public download-only debug APK
        run: |
          set -euo pipefail
          mkdir -p downloads
          cp artifact/Andee_Manual_Accessibility_API36_Arm64_Debug.apk downloads/
          sha256sum downloads/Andee_Manual_Accessibility_API36_Arm64_Debug.apk > downloads/Andee_Manual_Accessibility_API36_Arm64_Debug.sha256
          test -s downloads/Andee_Manual_Accessibility_API36_Arm64_Debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/Andee_Manual_Accessibility_API36_Arm64_Debug.*
          if ! git diff --cached --quiet; then
            git commit -m "Publish existing verified Andee manual-screen debug APK [skip ci]"
            git push origin HEAD:refs/heads/andee-play-review-prep-20261105
          fi
